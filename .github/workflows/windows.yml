name: Windows preview

on:
  pull_request:
    paths: ['apps/windows/**', 'src/ncf_image_upscaler/imaging.py', '.github/workflows/windows.yml']
  push:
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      setup_sha256: ${{ steps.provenance.outputs.setup_sha256 }}
      source_commit: ${{ steps.provenance.outputs.source_commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate independent Windows tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version=(Get-Content apps/windows/VERSION -Raw).Trim()
          if($env:GITHUB_REF_NAME -ne ('windows-v'+$version)){throw 'Windows tag/version mismatch'}
      - name: Explicit pinned build dependency preparation (no models)
        run: |
          ./apps/windows/scripts/prepare-dependencies.ps1 -Cache "$env:RUNNER_TEMP/ncf-cache"
          $compiler="$env:RUNNER_TEMP/ncf-cache/inno"
          $p=Start-Process "$env:RUNNER_TEMP/ncf-cache/innosetup-6.7.4.exe" -Wait -PassThru -WindowStyle Hidden -ArgumentList @('/VERYSILENT','/CURRENTUSER','/NORESTART',('/DIR="'+$compiler+'"'))
          if($p.ExitCode -ne 0){throw 'Compiler preparation failed'}
      - name: Scoped Windows Ruff (pinned, no host package installation)
        run: |
          python -c "import zipfile,os; zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/ncf-cache/ruff-0.14.2-py3-none-win_amd64.whl').extractall(os.environ['RUNNER_TEMP']+'/ncf-ruff')"
          $ruff="$env:RUNNER_TEMP/ncf-ruff/ruff-0.14.2.data/scripts/ruff.exe"
          & $ruff check --no-cache --config apps/windows/ruff.toml apps/windows
          if($LASTEXITCODE -ne 0){throw 'Scoped Windows lint failed'}
          & $ruff format --check --config apps/windows/ruff.toml apps/windows
          if($LASTEXITCODE -ne 0){throw 'Scoped Windows format failed'}
      - name: Offline payload and installer build
        run: |
          ./apps/windows/scripts/build.ps1 -Cache "$env:RUNNER_TEMP/ncf-cache" -BuildRoot "$env:RUNNER_TEMP/ncf-build" -ISCC "$env:RUNNER_TEMP/ncf-cache/inno/ISCC.exe"
      - name: Embedded runtime isolation and no-weights audit
        run: |
          $runtime="$env:RUNNER_TEMP/ncf-build/app/runtime/python.exe"
          & $runtime -c "import sys,numpy,PIL,scipy; from runtime_policy import configure_runtime; ort=configure_runtime(); from pathlib import Path; root=Path(sys.executable).resolve().parent.parent; assert all(Path(p).resolve().is_relative_to(root) for p in sys.path); print('Embedded imports isolated; ORT telemetry disabled')"
          if($LASTEXITCODE -ne 0){throw 'Runtime import check failed'}
          python apps/windows/scripts/audit-payload.py "$env:RUNNER_TEMP/ncf-build/app"
          if($LASTEXITCODE -ne 0){throw 'Payload audit failed'}
      - name: Controlled WPF lifecycle and Locate/Escape checks (no inference)
        run: |
          ./apps/windows/scripts/check-components.ps1 -TestRoot "$env:RUNNER_TEMP/ncf-components"
      - name: Native prerequisite policy and actual runtime readiness
        run: |
          ./apps/windows/scripts/check-prerequisites.ps1 -TestRoot "$env:RUNNER_TEMP/ncf-prerequisites"
      - name: Automatic preparation lifecycle (controlled transport, no model downloads)
        run: |
          ./apps/windows/scripts/check-auto-preparation.ps1 -TestRoot "$env:RUNNER_TEMP/ncf-auto-preparation"
      - name: Verify source identity and exact distributable allowlist
        id: provenance
        run: |
          $build=Get-Content "$env:RUNNER_TEMP/ncf-build/app/resources/build.json" -Raw | ConvertFrom-Json
          if($build.source_commit -ne $env:GITHUB_SHA -or $build.source_dirty -ne $false -or $build.model_weights_bundled -ne $false){throw 'Clean tagged source / weight-free provenance mismatch'}
          $setup='NCFImageUpscaler-0.1.0-preview.1-windows-x64-setup.exe'
          $allowed=@($setup,'SHA256SUMS.txt') | Sort-Object
          $actual=@(Get-ChildItem "$env:RUNNER_TEMP/ncf-build/installer" -Recurse -File | ForEach-Object {$_.Name}) | Sort-Object
          if(Compare-Object $allowed $actual){throw 'Unexpected distributable file'}
          $hash=(Get-FileHash "$env:RUNNER_TEMP/ncf-build/installer/$setup").Hash.ToLowerInvariant()
          if((Get-Content "$env:RUNNER_TEMP/ncf-build/installer/SHA256SUMS.txt" -Raw).Trim() -ne ($hash+'  '+$setup)){throw 'Checksum mismatch'}
          "setup_sha256=$hash" >> $env:GITHUB_OUTPUT
          "source_commit=$($build.source_commit)" >> $env:GITHUB_OUTPUT
      - name: Transfer only the two verified Windows assets between jobs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/ncf-build/installer/NCFImageUpscaler-0.1.0-preview.1-windows-x64-setup.exe
            ${{ runner.temp }}/ncf-build/installer/SHA256SUMS.txt

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v') && github.repository == 'no-colours-fabric/ncf-image-upscaler'
    needs: installer
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: ${{ runner.temp }}/ncf-release-assets
      - name: Create and verify a draft prerelease, never publish or replace
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SETUP_SHA256: ${{ needs.installer.outputs.setup_sha256 }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.installer.outputs.source_commit }}
        run: |
          ./apps/windows/scripts/create-draft-release.ps1 -Assets "$env:RUNNER_TEMP/ncf-release-assets"
