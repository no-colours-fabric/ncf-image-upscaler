name: Binary release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build and verify Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned build tooling
        run: |
          APP_HOME="$HOME/Library/Application Support/image-upscaler"
          export UV_CACHE_DIR="$APP_HOME/cache/uv"
          export UV_PROJECT_ENVIRONMENT="$APP_HOME/runtime/env"
          export UV_PYTHON_INSTALL_DIR="$APP_HOME/runtime/python"
          printf '%s\n' "UV_CACHE_DIR=$UV_CACHE_DIR" "UV_PROJECT_ENVIRONMENT=$UV_PROJECT_ENVIRONMENT" "UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR" >> "$GITHUB_ENV"
          python3 -m venv "$APP_HOME/runtime/tooling"
          "$APP_HOME/runtime/tooling/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'uv==0.13.4'
          UV="$APP_HOME/runtime/tooling/bin/uv"
          "$UV" python install 3.12.15
          "$UV" sync --locked --python 3.12.15
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          "$HOME/Library/Application Support/image-upscaler/runtime/env/bin/python" -c 'import os, tomllib; from pathlib import Path; version=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version'
      - name: Build standalone application and disk image
        run: |
          "$HOME/Library/Application Support/image-upscaler/runtime/env/bin/python" scripts/build-dmg.py
      - name: Check relocated installation without Python or model downloads
        run: |
          APP_HOME="$HOME/Library/Application Support/image-upscaler"
          "$APP_HOME/runtime/env/bin/python" scripts/check-binary.py "$APP_HOME"/runtime/releases/*/ImageUpscaler-*-arm64.dmg
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          APP_HOME="$HOME/Library/Application Support/image-upscaler"
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --draft --title "Image Upscaler ${RELEASE_TAG#v}" --notes-file packaging/RELEASE_NOTES.md "$APP_HOME"/runtime/releases/*/ImageUpscaler-*-arm64.dmg "$APP_HOME"/runtime/releases/*/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false
